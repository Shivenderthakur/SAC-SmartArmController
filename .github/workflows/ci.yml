name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      apk: ${{ steps.version.outputs.apk }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pinned: a newer stable brings a newer analyzer, and `flutter analyze`
      # fails on its new infos. Bump this on purpose, not by accident.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      # The version lives in pubspec.yaml; the run number is the build number,
      # so every build's versionCode is higher than the last.
      - name: Read the version
        id: version
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test -n "$version" || { echo "::error::no x.y.z version in pubspec.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "apk=smart-arm-$version-build$GITHUB_RUN_NUMBER.apk" >> "$GITHUB_OUTPUT"

      # The model is not in the repo, and the Android build needs it in assets.
      - name: Fetch the hand landmarker model
        run: ./tools/fetch_model.sh

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build the release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build }}
          cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.version.outputs.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk }}
          path: ${{ steps.version.outputs.apk }}

  # Only a push to main releases, and only this job can write to the repo.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}
      BUILD: ${{ needs.build.outputs.build }}
      APK: ${{ needs.build.outputs.apk }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}

      - name: Tag and publish a new version
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG is already released. Bump the version in pubspec.yaml to publish a new one."
            exit 0
          fi
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "$TAG (build $BUILD)" \
            --generate-notes
